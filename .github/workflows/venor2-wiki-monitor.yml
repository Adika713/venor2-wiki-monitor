name: Venor2 Wiki Monitor

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

env:
  URL: "https://wiki.venor2.hu/"
  CACHE_KEY: venor2-wiki-state

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Oldal letöltése
        id: fetch
        run: |
          CONTENT=$(curl -sL "${{ env.URL }}" | \
            sed 's/<style[^>]*>.*<\/style>//g' | \
            sed 's/<script[^>]*>.*<\/script>//g' | \
            sed 's/<[^>]*>//g' | \
            sed 's/&nbsp;//g; s/&amp;/\&/g' | \
            tr -s ' ' | \
            sed 's/^ *//; s/ *$//')
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Tartalom elemzése
        id: analyze
        run: |
          TEXT="${{ steps.fetch.outputs.content }}"
          LEN=${#TEXT}
          LOWER=$(echo "$TEXT" | tr '[:upper:]' '[:lower:]')

          if echo "$LOWER" | grep -q "hamarosan\|coming soon\|a tudástár épül\|nézz vissza"; then
            echo "type=placeholder" >> $GITHUB_OUTPUT
          elif [ $LEN -gt 100 ]; then
            HASH=$(echo "$TEXT" | sha256sum | cut -d' ' -f1)
            echo "type=content" >> $GITHUB_OUTPUT
            echo "hash=$HASH" >> $GITHUB_OUTPUT
          else
            echo "type=placeholder" >> $GITHUB_OUTPUT
          fi

      - name: Utolsó hash betöltése
        id: cache
        uses: actions/cache@v4
        with:
          path: .wiki-state
          key: ${{ env.CACHE_KEY }}

      - name: Változás ellenőrzése és mentése
        id: changed
        run: |
          if [ "${{ steps.analyze.outputs.type }}" != "content" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          NEW_HASH="${{ steps.analyze.outputs.hash }}"

          if [ -f .wiki-state/hash.txt ]; then
            OLD_HASH=$(cat .wiki-state/hash.txt)
            if [ "$NEW_HASH" = "$OLD_HASH" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          mkdir -p .wiki-state
          echo "$NEW_HASH" > .wiki-state/hash.txt
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Discord értesítés
        if: steps.changed.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "username": "Venor2 Wiki Monitor",
              "avatar_url": "https://i.imgur.com/4M34hi2.png",
              "content": "@everyone",
              "embeds": [{
                "title": "Venor2 Wiki frissult!",
                "description": "A wiki tartalma megvaltozott - mar nem a Hamarosan uzenet van!",
                "url": "https://wiki.venor2.hu/",
                "color": 5814783,
                "thumbnail": {"url": "https://wiki.venor2.hu/favicon.ico"},
                "fields": [
                  {"name": "Link", "value": "https://wiki.venor2.hu/", "inline": false}
                ],
                "footer": {"text": "Venor2 Wiki Monitor | GitHub Actions"},
                "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
              }]
            }' \
            "$WEBHOOK"
