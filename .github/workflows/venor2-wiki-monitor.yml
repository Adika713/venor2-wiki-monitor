name: Venor2 Wiki Monitor

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  URL: https://wiki.venor2.hu/
  CACHE_KEY: venor2-wiki-state

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Oldal letöltése
        run: |
          curl -sL "${{ env.URL }}" | \
            sed 's/<style[^>]*>.*<\/style>//g' | \
            sed 's/<script[^>]*>.*<\/script>//g' | \
            sed 's/<[^>]*>//g' | \
            sed 's/&nbsp;//g; s/&amp;/\&/g' | \
            tr -s ' ' | \
            sed 's/^ *//; s/ *$//' > /tmp/wiki-content.txt

      - name: Tartalom elemzése
        id: analyze
        run: |
          TEXT=$(cat /tmp/wiki-content.txt)
          LEN=${#TEXT}
          LOWER=$(echo "$TEXT" | tr '[:upper:]' '[:lower:]')

          if echo "$LOWER" | grep -q "hamarosan\|coming soon\|a tudastar epul\|nezz vissza"; then
            echo "type=placeholder" >> $GITHUB_OUTPUT
          elif [ $LEN -gt 100 ]; then
            HASH=$(echo "$TEXT" | sha256sum | cut -d' ' -f1)
            echo "type=content" >> $GITHUB_OUTPUT
            echo "hash=$HASH" >> $GITHUB_OUTPUT
          else
            echo "type=placeholder" >> $GITHUB_OUTPUT
          fi

      - name: Utolsó hash betöltése
        id: cache
        uses: actions/cache@v5
        with:
          path: .wiki-state
          key: ${{ env.CACHE_KEY }}

      - name: Változás ellenőrzése és status.json frissítése
        id: changed
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STATUS="${{ steps.analyze.outputs.type }}"
          NEW_HASH="${{ steps.analyze.outputs.hash }}"
          CHANGED=false

          # check_count olvasása
          COUNT=0
          if [ -f docs/status.json ]; then
            COUNT=$(grep -o '"check_count": [0-9]*' docs/status.json | grep -o '[0-9]*')
            : ${COUNT:=0}
          fi
          COUNT=$((COUNT + 1))

          # last_change megőrzése
          LAST_CHANGE=""
          if [ -f docs/status.json ]; then
            LAST_CHANGE=$(grep -o '"last_change": "[^"]*"' docs/status.json | cut -d'"' -f4)
          fi

          if [ "$STATUS" = "content" ]; then
            if [ -f .wiki-state/hash.txt ]; then
              OLD_HASH=$(cat .wiki-state/hash.txt)
              if [ "$NEW_HASH" != "$OLD_HASH" ]; then
                CHANGED=true
                LAST_CHANGE=$NOW
              fi
            else
              CHANGED=true
              LAST_CHANGE=$NOW
            fi
            mkdir -p .wiki-state
            echo "$NEW_HASH" > .wiki-state/hash.txt
          elif [ "$STATUS" = "placeholder" ]; then
            OLD_STATUS=""
            if [ -f docs/status.json ]; then
              OLD_STATUS=$(grep -o '"status": "[^"]*"' docs/status.json | cut -d'"' -f4)
            fi
            if [ "$OLD_STATUS" != "placeholder" ]; then
              CHANGED=true
            fi
          fi

          mkdir -p docs
          cat > docs/status.json <<EOF
{"status":"$STATUS","last_check":"$NOW","last_change":"${LAST_CHANGE:-$NOW}","check_count":$COUNT}
EOF

          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Discord értesítés (ha változott)
        if: steps.changed.outputs.changed == 'true' && steps.analyze.outputs.type == 'content'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d '{
              "username": "Venor2 Wiki Monitor",
              "content": "@everyone",
              "embeds": [{
                "title": "Venor2 Wiki frissult!",
                "description": "A wiki tartalma megvaltozott - mar nem a Hamarosan uzenet van!",
                "url": "https://wiki.venor2.hu/",
                "color": 5814783,
                "fields": [
                  {"name": "Link", "value": "https://wiki.venor2.hu/", "inline": false}
                ],
                "footer": {"text": "Venor2 Wiki Monitor | GitHub Actions"},
                "timestamp": "'"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"'"
              }]
            }' \
            "$WEBHOOK"

      - name: Változások commit-olása
        run: |
          git config user.name "venor2-bot"
          git config user.email "venor2-bot@users.noreply.github.com"
          git add docs/status.json
          git diff --staged --quiet || git commit -m "status: ${{ steps.changed.outputs.status }} [$(date -u +'%H:%M:%S')]"
          git push origin main
