name: Venor2 Wiki Monitor

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  URL: "https://wiki.venor2.hu/"
  WH: "${{ secrets.DISCORD_WEBHOOK }}"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch
        run: |
          curl -sL "$URL" | sed 's/<style[^>]*>.*<\/style>//g;s/<script[^>]*>.*<\/script>//g;s/<[^>]*>//g;s/&nbsp;//g;s/&amp;/\&/g' | tr -s ' ' | sed 's/^ *//;s/ *$//' > /tmp/pg.txt

      - name: Parse
        id: analyze
        run: |
          T=$(cat /tmp/pg.txt)
          L=$(echo "$T" | tr '[:upper:]' '[:lower:]')
          if echo "$L" | grep -q "hamarosan\|coming soon\|a tudastar epul\|nezz vissza"; then
            echo "type=placeholder" >> $GITHUB_OUTPUT
          elif [ ${#T} -gt 100 ]; then
            echo "type=content" >> $GITHUB_OUTPUT
            echo "hash=$(echo "$T" | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "type=placeholder" >> $GITHUB_OUTPUT
          fi

      - name: Diff
        id: changed
        run: |
          T="${{ steps.analyze.outputs.type }}"
          H="${{ steps.analyze.outputs.hash }}"
          C=false
          N=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          [ -f docs/status.json ] && CNT=$(grep -o '"check_count":[0-9]*' docs/status.json | grep -o '[0-9]*')
          : "${CNT:=0}"
          CNT=$((CNT+1))
          LC=""
          [ -f docs/status.json ] && LC=$(grep -o '"last_change":"[^"]*"' docs/status.json | cut -d'"' -f4)
          if [ "$T" = "content" ]; then
            OH=""; [ -f docs/.hash ] && OH=$(cat docs/.hash)
            if [ "$H" != "$OH" ]; then C=true; LC=$N; fi
            echo "$H" > docs/.hash
          elif [ "$T" = "placeholder" ]; then
            OS=""; [ -f docs/status.json ] && OS=$(grep -o '"status":"[^"]*"' docs/status.json | cut -d'"' -f4)
            [ "$OS" != "placeholder" ] && C=true
          fi
          echo '{"status":"'"$T"'","last_check":"'"$N"'","last_change":"'"${LC:-$N}"'","check_count":'"$CNT"'}' > docs/status.json
          echo "changed=$C" >> $GITHUB_OUTPUT

      - name: Discord embed
        env:
          ST: "${{ steps.analyze.outputs.type }}"
        run: |
          N=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HT=$(TZ='Europe/Budapest' date +"%Y.%m.%d %H:%M:%S" 2>/dev/null || date -d '+2 hours' +"%Y.%m.%d %H:%M:%S" 2>/dev/null || echo "$N")
          CT=$(grep -o '"check_count":[0-9]*' docs/status.json | grep -o '[0-9]*' || echo "0")
          if [ "$ST" = "content" ]; then
            CL="5763719"; SI=":green_circle:"; SS="Van tartalom"
          else
            CL="15548997"; SI=":red_circle:"; SS="Meg nincs tartalom"
          fi
          jq -n --arg u "Venor2 Wiki" --arg a "https://wiki.venor2.hu/favicon.ico" --argjson c "$CL" --arg i "$SI" --arg s "$SS" --arg t "$N" --arg h "$HT" --arg n "$CT" '{"username":$u,"avatar_url":$a,"embeds":[{"title":"Venor2 Wiki Status","color":$c,"thumbnail":{"url":$a},"fields":[{"name":"Allapot","value":($i+" "+$s),"inline":true},{"name":"Utolso ellenorzes","value":$h,"inline":true},{"name":"Ellenorzesek szama",value:$n,"inline":true},{"name":"Link","value":"[wiki.venor2.hu](https://wiki.venor2.hu/)","inline":false}],"footer":{"text":"GitHub Actions | 1 percenkent"},"timestamp":$t}]}' > /tmp/embed.json
          [ -f docs/.msg_id ] && curl -s -X DELETE "$WH/messages/$(cat docs/.msg_id)" > /dev/null || true
          R=$(curl -s -X POST "$WH?wait=true" -H "Content-Type: application/json" -d @/tmp/embed.json)
          ID=$(echo "$R" | grep -o '"id":"[0-9]*"' | head -1 | cut -d'"' -f4)
          [ -n "$ID" ] && echo "$ID" > docs/.msg_id

      - name: Ping on change
        if: steps.changed.outputs.changed == 'true'
        env:
          ST: "${{ steps.analyze.outputs.type }}"
        run: |
          if [ "$ST" = "content" ]; then
            curl -s -X POST "$WH" -H "Content-Type: application/json" --data-raw '{"username":"Venor2 Wiki","content":"<@1469423126105297019> A wiki frissult! Nezz ra: https://wiki.venor2.hu/"}'
          fi

      - name: Commit
        run: |
          git config user.name "venor2-bot"
          git config user.email "venor2-bot@users.noreply.github.com"
          touch docs/.hash docs/.msg_id
          git add docs/status.json docs/.hash docs/.msg_id
          git diff --staged --quiet || git commit -m "s:${{ steps.analyze.outputs.type }}"
          git push origin main
